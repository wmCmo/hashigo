<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- No `maximum-scale`: pinch-zoom is how he reads a small 型 label, and
         locking it out is an accessibility regression, not a polish. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Decision 32: both grounds ship. The two `theme-color` entries let the
         phone's own chrome follow, which is what stops a light app from sitting
         in a black status bar (and the reverse at night). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECEAE5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)" />
    <title>梯子 · review</title>
    <link rel="icon" href="./brand/favicon.svg" />
    <!-- The PWA set. `manifest.webmanifest`, `sw.js` and `icons/` are copied
         verbatim out of `app/public/` — their URLs are a contract, so they are
         the one thing in this build that must not be hashed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS never reads the manifest. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hashigo" />
    <!-- The wordmark is `font-display: block`, so it is on the critical path by
         design — a brief gap reads as loading, a synthesized Georgia 650 reads as
         broken. Preloaded so that gap is as short as it can be. -->
    <link
      rel="preload"
      href="./fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-view="review">
    <!-- Decision 17's banner. Not dismissible, and it is the FIRST thing in the
         document so it is the first thing a screen reader reaches. -->
    <div id="banner" class="banner" role="status" hidden></div>

    <section id="boot" class="boot">
      <!-- The mark at full size — the THREE-rung construction, because this one
           is large enough for it. The wordmark is the locked display instance:
           opsz 144, wght 650, SOFT 100, WONK 1. -->
      <h1 class="boot-lockup">
        <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round">
            <path d="M16 87L27.5 32" />
            <path d="M84 87L72.5 32" />
          </g>
          <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
            <path d="M18.09 77H81.91" />
            <path d="M22.27 57H77.73" />
            <path d="M25.83 40H74.17" />
          </g>
          <path
            d="M31.47 13H68.53"
            fill="none"
            stroke="var(--vermilion)"
            stroke-width="9"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark">hashigo</span>
      </h1>
      <div id="bootlog" class="bootlog" aria-live="polite"></div>
      <p class="bootnote">
        First run fetches the database into OPFS. After that it is local and offline.
      </p>
    </section>

    <section id="review" class="review" data-state="prompt" hidden>
      <header>
        <!-- His request 5. On the LEFT: decision 23 put the replay button
             bottom-right for his right thumb, and a drawer under that thumb would
             be opened by accident mid-card. -->
        <button id="sidebartoggle" class="sidebartoggle" type="button"
                aria-controls="sidebar" aria-expanded="false" aria-label="browse the collection">☰</button>
        <!-- Decision 32's mark, in the two-rung small construction: below 24px
             the three-rung one collapses. The top rung is the ONE vermilion on
             this screen — everything else that used to be an accent is indigo. -->
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round">
            <path d="M17 86L27 38" stroke-width="12" />
            <path d="M83 86L73 38" stroke-width="12" />
            <path d="M19.5 74H80.5" stroke-width="11" />
            <path d="M23.67 54H76.33" stroke-width="11" />
          </g>
          <path
            d="M30 16H70"
            fill="none"
            stroke="var(--vermilion)"
            stroke-width="11"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark-ui">hashigo</span>
        <span id="progress">—</span>
        <!-- His request 4, and it sits INSIDE the header on purpose. Three
             separately-sticky elements each claiming `top: 0` is how a header
             ends up behind a banner — measured. One sticky thing, and the bar
             rides its bottom edge, so there is no offset to keep in sync. -->
        <div
          id="progressbar"
          class="progressbar"
          role="progressbar"
          aria-label="cards answered this session"
          aria-valuemin="0"
          aria-valuenow="0"
          aria-valuemax="0"
        >
          <i id="progressfill"></i>
        </div>
      </header>

      <main>
        <div id="deck" class="deck"></div>
        <!-- `src/render`'s output is appended here, untouched. Every class inside
             comes from that module; style.css targets those names. -->
        <div id="cardhost" class="cardhost"></div>
        <div id="hint" class="hint"></div>
        <!-- His #9's look-ahead. Visible rather than subtle, because the state it
             announces is one where a familiar keystroke would do the wrong thing
             to a card he cannot see. -->
        <div id="peek" class="peek" role="status" hidden></div>
        <button id="readingtoggle" class="readingtoggle" hidden></button>
      </main>

      <!-- Round, bottom RIGHT: he reviews one-handed with his right hand, and a
           native <audio controls> puts play at the far left of a full-width strip,
           which is the worst corner for that thumb. -->
      <button id="replay" class="replay" type="button" aria-label="play the clip again">
        &#9654;
      </button>

      <!-- ONE FIXED FOOTER, AND IT IS THE FIX FOR A REAL BUG.
           These two rows used to be separately `position: fixed`, each with its
           own hand-tuned `bottom:` — and the reveal bar covered the row above it
           by 19px on a 375x812 viewport, hiding the bottom of every operation
           button. The offsets could not stay right: `.bar`'s height is set by its
           font and its padding, so any change to either silently moved it over
           its neighbour. Stacked in normal flow inside one fixed box, they cannot
           overlap at any size. `--footer-h` is measured from this element (see
           main.ts) so the card's bottom padding and the replay button follow it
           instead of guessing. -->
      <div id="footer" class="footer">
      <!-- His #9 and #7 on mobile: every review operation as a real control.
           Arrows step between cards WITHOUT grading; the rest act on the card. -->
      <div class="ops">
        <button id="prevcard" class="op" type="button" aria-label="previous card">←</button>
        <button id="oppin" class="op" type="button" aria-label="pin">pin<span class="kbd-inline"> ⇧p</span></button>
        <button id="oparchive" class="op" type="button" aria-label="archive">archive<span class="kbd-inline"> a</span></button>
        <button id="opundo" class="op" type="button" aria-label="undo">undo<span class="kbd-inline"> ⌃z</span></button>
        <button id="opdelete" class="op danger" type="button" aria-label="delete">delete<span class="kbd-inline"> d</span></button>
        <button id="nextcard" class="op" type="button" aria-label="next card">→</button>
      </div>

      <div id="bar" class="bar">
        <button id="reveal" class="reveal-zone" type="button">
          reveal<span class="kbd">space</span>
        </button>
        <div id="grades" class="grades">
          <button id="forgot" class="no" type="button">forgot<span class="kbd">f</span></button>
          <button id="remembered" class="ok" type="button">
            remembered<span class="kbd">j</span>
          </button>
        </div>
      </div>
      </div>
    </section>

    <!-- His #6. A view, not a layer: a gallery is somewhere you stay. -->
    <section id="gallery" class="gallery">
      <header class="gallery-head">
        <button id="galleryback" class="gallery-back" type="button">← review</button>
        <span id="gallerytitle" class="gallery-title"></span>
        <span id="gallerycount" class="gallery-count"></span>
      </header>
      <div class="gallery-controls">
        <input id="gallerysearch" class="gallery-search" type="search" placeholder="filter"
               autocomplete="off" spellcheck="false" />
        <select id="gallerysort" class="gallery-sort" aria-label="sort">
          <option value="name">name</option>
          <option value="relevance">relevance</option>
        </select>
        <label class="gallery-toggle">
          <input id="galleryarchived" type="checkbox" checked /> archived
        </label>
      </div>
      <div id="gallerygrid" class="gallery-grid"></div>
    </section>

    <!-- His #13, and his standing rule: every 操作 on the desktop exists on
         mobile. Undo is a BUTTON, not only ctrl+z. -->
    <div id="say" class="say" role="status" hidden></div>

    <!-- Decision 32 §5. The mark climbs ONE rung when a session is cleared: the
         ladder does not grow, the camera moves. It is identical at rest before
         and after, which is the point — the movement is the feedback, not a
         changed picture. -->
    <section id="done" class="done" hidden>
      <svg id="climbmark" class="climb-mark" viewBox="0 0 100 100" aria-hidden="true"
           focusable="false"></svg>
      <h2>done</h2>
      <p id="donetext"></p>
      <button id="backup" type="button">export backup</button>
    </section>

    <!-- His request 5, the browsing half. `create` is deliberately absent and
         says why: it is blocked on the card-id decision (notes/crud-audit.md). -->
    <div id="sidebarscrim" class="sidebar-scrim"></div>
    <aside id="sidebar" class="sidebar" aria-label="collection">
      <div class="sidebar-head">
        <span>browse</span>
        <button id="sidebarclose" class="layer-close" type="button" aria-label="close">✕</button>
      </div>
      <!-- His #4: NO card list here. 10,000+ cards do not belong in a 330px
           drawer; finding one is Ctrl+K's job and seeing a set is the gallery's. -->
      <button id="palettebutton" class="sidebar-action" type="button">
        search cards <span class="kbd-inline">ctrl+k</span>
      </button>
      <button id="dashboardlink" class="sidebar-action" type="button">dashboard</button>
      <button id="settingslink" class="sidebar-action" type="button">settings</button>
      <!-- Hidden until the browser actually offers an install. A control that
           cannot work is worse than no control — the same rule the sourceless
           <audio> element is hidden under. `app/install.ts` says why. -->
      <button id="installapp" class="sidebar-action sidebar-action-install" type="button" hidden>
        install on this device
        <i id="installnote" class="sidebar-action-note"></i>
      </button>
      <div id="decklist" class="deck-list"></div>
      <div id="newcardhost" class="newcard-host"></div>
    </aside>

    <!-- His request 2. Layers are appended here and STACK: a link inside a
         preview opens another on top, which is how Mochi does it and which he
         likes. Outside #review on purpose — a preview is not a review. -->
        <div id="layers" class="layers"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

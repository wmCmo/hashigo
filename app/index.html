<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- No `maximum-scale`: pinch-zoom is how he reads a small 型 label, and
         locking it out is an accessibility regression, not a polish. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Decision 32: both grounds ship. The two `theme-color` entries let the
         phone's own chrome follow, which is what stops a light app from sitting
         in a black status bar (and the reverse at night). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECEAE5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)" />
    <title>梯子 · review</title>
    <link rel="icon" href="./brand/favicon.svg" />
    <!-- The PWA set. `manifest.webmanifest`, `sw.js` and `icons/` are copied
         verbatim out of `app/public/` — their URLs are a contract, so they are
         the one thing in this build that must not be hashed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS never reads the manifest. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hashigo" />
    <!-- The wordmark is `font-display: block`, so it is on the critical path by
         design — a brief gap reads as loading, a synthesized Georgia 650 reads as
         broken. Preloaded so that gap is as short as it can be. -->
    <link
      rel="preload"
      href="./fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <!-- HIS THEME, APPLIED BEFORE ANYTHING PAINTS.
         `main.ts` is a module script and therefore runs after the document is
         parsed, which is too late: a forced-light user would watch the boot
         screen flash dark first, and the boot screen is on display for as long
         as the database takes to fetch. These four lines are the only reason
         this is inline. Everything else about the theme is in `app/theme.ts`,
         which exports the key this reads; a test pins that the two agree. -->
    <script>
      try {
        var t = localStorage.getItem("hashigo.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          var c = t === "dark" ? "#1A1815" : "#ECEAE5";
          for (var m of document.querySelectorAll('meta[name="theme-color"]')) m.content = c;
        }
      } catch (cause) {
        /* a disabled localStorage costs the preference, not the page */
      }
    </script>
  </head>
  <body data-view="review">
    <!-- Decision 17's banner. Not dismissible, and it is the FIRST thing in the
         document so it is the first thing a screen reader reaches. -->
    <div id="banner" class="banner" role="status" hidden></div>

    <section id="boot" class="boot">
      <!-- The mark at full size — the THREE-rung construction, because this one
           is large enough for it. The wordmark is the locked display instance:
           opsz 144, wght 650, SOFT 100, WONK 1. -->
      <h1 class="boot-lockup">
        <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round">
            <path d="M16 87L27.5 32" />
            <path d="M84 87L72.5 32" />
          </g>
          <!-- THE RUNGS ARE REPLACED WHILE A SEED FILE DOWNLOADS. `app/main.ts`
               swaps this group's contents for `climbFrame`'s output and puts
               them back at rest when it finishes, so the static mark below is
               both the resting frame and the fallback when nothing animates.
               `test/app-logic.test.ts` pins that `railX`/`slotY` reproduce these
               four `d` attributes exactly — the animation draws the SHIPPED
               mark rather than a copy that can drift from it. -->
          <g id="bootrungs" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
            <path d="M18.09 77H81.91" />
            <path d="M22.27 57H77.73" />
            <path d="M25.83 40H74.17" />
          </g>
          <path
            id="bootaccent"
            d="M31.47 13H68.53"
            fill="none"
            stroke="var(--vermilion)"
            stroke-width="9"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark">hashigo</span>
      </h1>
      <!-- CHANGE IS REASSURANCE, MOTION IS NOT — Zach, 2026-09-16. A spinner
           looks the same whether the transfer is healthy or hung; a byte counter
           going up is evidence. So this is mostly numbers, and the climb above is
           deliberately slow enough to read as breathing rather than as working.
           Hidden until a fetch has run past the gate: a boot that fetches nothing
           must never flash it. -->
      <div id="bootfetch" class="bootfetch" hidden>
        <p id="bootphase" class="bootphase" role="status" aria-live="polite"></p>
        <div id="bootbar" class="bootbar"><i id="bootfill"></i></div>
        <div class="bootnums">
          <span id="bootgot"></span><span id="bootrate"></span>
        </div>
        <p id="booteta" class="booteta"></p>
        <!-- The only question a long transfer raises is SLOW OR BROKEN, so this
             is the highest-value thing on the screen. No warning colour:
             `--vermilion` means the next rung, and spending it on an error state
             poisons it — the same argument as delete having no colour. -->
        <p id="bootstall" class="bootstall" hidden></p>
      </div>
      <div id="bootlog" class="bootlog" aria-live="polite"></div>
      <p class="bootnote">
        First run fetches the database into OPFS. After that it is local and offline.
      </p>
    </section>

    <section id="review" class="review" data-state="prompt" hidden>
      <header>
        <!-- His request 5. On the LEFT: decision 23 put the replay button
             bottom-right for his right thumb, and a drawer under that thumb would
             be opened by accident mid-card. -->
        <button id="sidebartoggle" class="sidebartoggle" type="button"
                aria-controls="sidebar" aria-expanded="false" aria-label="browse the collection" data-icon="list"></button>
        <!-- Decision 32's mark, in the two-rung small construction: below 24px
             the three-rung one collapses. The top rung is the ONE vermilion on
             this screen — everything else that used to be an accent is indigo. -->
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round">
            <path d="M17 86L27 38" stroke-width="12" />
            <path d="M83 86L73 38" stroke-width="12" />
            <path d="M19.5 74H80.5" stroke-width="11" />
            <path d="M23.67 54H76.33" stroke-width="11" />
          </g>
          <path
            d="M30 16H70"
            fill="none"
            stroke="var(--vermilion)"
            stroke-width="11"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark-ui">hashigo</span>
        <!-- Stage 11's status, at a glance. Zach asked for this because he
             archived 数字 on his phone twice before realising the desktop had
             never heard about it — the failure was SILENT, which is the part
             worth fixing. A title and aria-label carry the same words the
             sidebar row spells out, so it is not colour-only. -->
        <button id="syncdot" class="syncdot" type="button" data-state="never"
                aria-live="polite">
          <i aria-hidden="true"></i><span id="syncdottext" class="visually-hidden"></span>
        </button>
        <span id="progress">—</span>
        <!-- His request 4, and it sits INSIDE the header on purpose. Three
             separately-sticky elements each claiming `top: 0` is how a header
             ends up behind a banner — measured. One sticky thing, and the bar
             rides its bottom edge, so there is no offset to keep in sync. -->
        <div
          id="progressbar"
          class="progressbar"
          role="progressbar"
          aria-label="cards answered this session"
          aria-valuemin="0"
          aria-valuenow="0"
          aria-valuemax="0"
        >
          <i id="progressfill"></i>
          <!-- Zach, 2026-09-17: the misses, as a proportion of the same bar. It
               comes AFTER the fill and both are anchored left, so the red is a
               prefix drawn over the indigo rather than a slice cut out of it —
               `app/progress.ts` carries why that is the readable one. -->
          <i id="progressmiss" class="miss"></i>
        </div>
      </header>

      <main>
        <div id="deck" class="deck"></div>
        <!-- `src/render`'s output is appended here, untouched. Every class inside
             comes from that module; style.css targets those names. -->
        <div id="cardhost" class="cardhost"></div>
        <div id="hint" class="hint"></div>
        <!-- WHAT LINKS HERE — Zach, 2026-09-14. Empty and hidden until the walk
             is over, and that is a CORRECTNESS rule rather than a layout
             preference: 94% of links display the target's own name, so the cards
             linking to 転 are 転出, 移転, 転職 — every one of them containing the
             kanji. On a 漢字 card (draw it from memory) or a mode-2 単語 card
             (the word masked, the clip the prompt), a backlink list standing at
             the bottom of the page is the answer, printed. See `paintBacklinks`. -->
        <div id="backlinks" class="backlinks-host" hidden></div>
        <!-- His #9's look-ahead. Visible rather than subtle, because the state it
             announces is one where a familiar keystroke would do the wrong thing
             to a card he cannot see. -->
        <!-- His #9's look-ahead. The banner CARRIES THE WAY OUT as a real
             button: the old one stated that nothing could be graded and left
             the escape to be inferred from the arrows, and Zach read that as
             the app being stuck. A dead-end state has to name its exit. -->
        <div id="peek" class="peek" role="status" hidden>
          <span id="peektext"></span>
          <button id="peekback" class="peek-back" type="button" data-icon="arrow-u-up-left">back to your card</button>
        </div>
        <button id="readingtoggle" class="readingtoggle" type="button" aria-pressed="false" data-icon="toggle-left" data-icon-on="toggle-right-fill" hidden><span class="op-label">Reading</span></button>
      </main>

      <!-- Round, bottom RIGHT: he reviews one-handed with his right hand, and a
           native <audio controls> puts play at the far left of a full-width strip,
           which is the worst corner for that thumb. -->
      <button id="replay" class="replay" type="button" aria-label="play the clip again" data-icon="play"></button>

      <!-- ONE FIXED FOOTER, AND IT IS THE FIX FOR A REAL BUG.
           These two rows used to be separately `position: fixed`, each with its
           own hand-tuned `bottom:` — and the reveal bar covered the row above it
           by 19px on a 375x812 viewport, hiding the bottom of every operation
           button. The offsets could not stay right: `.bar`'s height is set by its
           font and its padding, so any change to either silently moved it over
           its neighbour. Stacked in normal flow inside one fixed box, they cannot
           overlap at any size. `--footer-h` is measured from this element (see
           main.ts) so the card's bottom padding and the replay button follow it
           instead of guessing. -->
      <div id="footer" class="footer">
      <!-- His #9 and #7 on mobile: every review operation as a real control.
           Arrows step between cards WITHOUT grading; the rest act on the card.

           PIN, ARCHIVE AND DELETE MOVED BEHIND `⋯` on 2026-09-12. His rule is
           that every 操作 on the desktop exists on mobile, as a real button and
           not only a shortcut — a menu present on both surfaces satisfies that,
           and `delete` two buttons from `undo` in his right thumb's zone did
           not deserve the room. Measured first: 0 of 7,716 cards are pinned and
           244 archived, against a replay he presses every card. UNDO STAYS OUT
           of the menu — it is the safety net, and putting the thing you reach
           for when something already went wrong behind two taps is backwards. -->
      <div class="ops">
        <button id="prevcard" class="op" type="button" aria-label="previous card" data-icon="caret-left"></button>
        <button id="opmore" class="op" type="button" aria-label="card actions" data-icon="dots-three"></button>
        <button id="opundo" class="op" type="button" aria-label="undo" data-icon="arrow-counter-clockwise">undo<span class="kbd-inline"> ⌃z</span></button>
        <button id="nextcard" class="op" type="button" aria-label="next card" data-icon="caret-right"></button>
      </div>

      <!-- The shadowing controls, 2026-09-12. Below the operation row because he
           touches these every card and those almost never; nearer the bottom is
           nearer the thumb.

           ALWAYS PRESENT, never conditional on the card having a clip. The row
           would otherwise appear and disappear between cards, moving the
           operation row above it — and `loop` and `speed` are session settings
           that apply to the NEXT clip whatever this card holds, so there is
           nothing to disable either. `your take` is the one thing that hides,
           and only because he just made it exist. -->
      <!-- The label is the FIRST CHILD and carries no leading whitespace: these
           are repainted with `button.firstChild.textContent`, the same way the
           pin and archive buttons were, so that the keycap hint beside it is
           left alone. -->
      <div id="shadowbar" class="shadowbar">
        <button id="oploop" class="op" type="button" aria-pressed="false"
                aria-label="loop the clip" data-icon="repeat" data-icon-on="repeat-fill"><span class="op-label">loop</span><span class="kbd-inline"> l</span></button>
        <button id="opspeed" class="op" type="button"
                aria-label="playback speed" data-icon="gauge"><span class="op-label">1×</span><span class="kbd-inline"> s</span></button>
        <button id="oprecord" class="op" type="button"
                aria-label="record your voice" data-icon="microphone" data-icon-on="microphone-fill"><span class="op-label">record</span><span class="kbd-inline"> m</span></button>
        <button id="optake" class="op" type="button" hidden
                aria-label="play your recording" data-icon="headphones"><span class="op-label">your take</span><span class="kbd-inline"> ⇧m</span></button>
      </div>

      <!-- THE STEPPER GOES LAST, AND THAT IS A MISTAP FIX. Zach, 2026-09-13:
           *"when i click next next next, when it ended, it becomes forgot and
           you would misclick it"*. `next` used to lead the row, so the moment
           the walk ran out the button vanished and `forgot` slid left into the
           spot his thumb was already tapping — a lapse written on a card he had
           just remembered. Ordering it `forgot · remembered · next` puts the
           vanishing control at the END, where the thing that grows into its
           place is `remembered`: still a mistap, but the one the corpus says is
           usually right anyway (96.24% retention over 103,110 reviews), and
           `undo` is one button away in the row above. -->
      <div id="bar" class="bar">
        <div id="grades" class="grades">
          <button id="forgot" class="no" type="button" data-icon="x">forgot<span class="kbd">f</span></button>
          <button id="remembered" class="ok" type="button" data-icon="check">
            remembered<span class="kbd">j</span>
          </button>
        </div>
        <!-- The word is its own span because the reveal is a WALK now, not a
             switch: it reads `reveal`, then `next · 3`, `next · 2`, `next · 1`,
             then the button goes. A stepper that does not say how far it has to
             go reads as a button that stopped working. -->
        <button id="reveal" class="reveal-zone" type="button">
          <span id="revealword">reveal</span><span class="kbd">space</span>
        </button>
      </div>
      </div>
    </section>

    <!-- His #6. A view, not a layer: a gallery is somewhere you stay. -->
    <section id="gallery" class="gallery">
      <header class="gallery-head">
        <button id="galleryback" class="gallery-back" type="button" data-icon="arrow-left">review</button>
        <span id="gallerytitle" class="gallery-title"></span>
        <span id="gallerycount" class="gallery-count"></span>
      </header>
      <div class="gallery-controls">
        <input id="gallerysearch" class="gallery-search" type="search" placeholder="filter"
               autocomplete="off" spellcheck="false" />
        <select id="gallerysort" class="gallery-sort" aria-label="sort">
          <option value="name">name</option>
          <option value="relevance">relevance</option>
        </select>
        <label class="gallery-toggle">
          <input id="galleryarchived" type="checkbox" checked /> archived
        </label>
      </div>
      <div id="gallerygrid" class="gallery-grid"></div>
    </section>

    <!-- His #13, and his standing rule: every 操作 on the desktop exists on
         mobile. Undo is a BUTTON, not only ctrl+z. -->
    <div id="say" class="say" role="status" hidden></div>

    <!-- Decision 32 §5. The mark climbs ONE rung when a session is cleared: the
         ladder does not grow, the camera moves. It is identical at rest before
         and after, which is the point — the movement is the feedback, not a
         changed picture. -->
    <section id="done" class="done" hidden>
      <svg id="climbmark" class="climb-mark" viewBox="0 0 100 100" aria-hidden="true"
           focusable="false"></svg>
      <h2>done</h2>
      <p id="donetext"></p>
      <button id="backup" type="button" data-icon="download-simple">export backup</button>
    </section>

    <!-- His request 5, the browsing half. `create` is deliberately absent and
         says why: it is blocked on the card-id decision (notes/crud-audit.md). -->
    <div id="sidebarscrim" class="sidebar-scrim"></div>
    <aside id="sidebar" class="sidebar" aria-label="collection">
      <!-- Desktop only — `display: none` until the rail stops being a drawer.
           On a phone the header three lines up already carries this mark. -->
      <div class="rail-brand">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round">
            <path d="M17 86L27 38" stroke-width="12" />
            <path d="M83 86L73 38" stroke-width="12" />
            <path d="M19.5 74H80.5" stroke-width="11" />
            <path d="M23.67 54H76.33" stroke-width="11" />
          </g>
          <path
            d="M30 16H70"
            fill="none"
            stroke="var(--vermilion)"
            stroke-width="11"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark-ui">hashigo</span>
      </div>
      <div class="sidebar-head">
        <span>browse</span>
        <button id="sidebarclose" class="layer-close" type="button" aria-label="close" data-icon="x"></button>
      </div>
      <!-- His #4: NO card list here. 10,000+ cards do not belong in a 330px
           drawer; finding one is Ctrl+K's job and seeing a set is the gallery's. -->
      <button id="palettebutton" class="sidebar-action" type="button">
        <span class="sa-label" data-icon="magnifying-glass">search cards</span> <span class="kbd-inline">ctrl+k</span>
      </button>
      <!-- His standing rule: every 操作 on the desktop exists on mobile. The
           header dot is the glance; this row is the control and the detail. -->
      <button id="synclink" class="sidebar-action sidebar-action-sync" type="button">
        <span class="sa-label" data-icon="arrows-clockwise">sync now</span>
        <i id="syncdetail" class="sidebar-action-note"></i>
      </button>
      <button id="dashboardlink" class="sidebar-action" type="button"><span class="sa-label" data-icon="chart-bar">dashboard</span></button>
      <button id="settingslink" class="sidebar-action" type="button"><span class="sa-label" data-icon="gear-six">settings</span></button>
      <!-- Hidden until the browser actually offers an install. A control that
           cannot work is worse than no control — the same rule the sourceless
           <audio> element is hidden under. `app/install.ts` says why. -->
      <button id="installapp" class="sidebar-action sidebar-action-install" type="button" hidden>
        <span class="sa-label" data-icon="download-simple">install on this device</span>
        <i id="installnote" class="sidebar-action-note"></i>
      </button>
      <div id="decklist" class="deck-list"></div>
      <div id="newcardhost" class="newcard-host"></div>
    </aside>

    <!-- His request 2. Layers are appended here and STACK: a link inside a
         preview opens another on top, which is how Mochi does it and which he
         likes. Outside #review on purpose — a preview is not a review. -->
        <div id="layers" class="layers"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

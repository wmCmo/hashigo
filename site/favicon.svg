<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hashigo">
  <!-- app/brand/favicon.svg, with its colours following the browser's theme so the
       ink rails stay visible on a dark tab strip. -->
  <style>
    .ink { stroke: #3A3A3A; } .ruri { stroke: #1F5FE0; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #E8E8E8; } .ruri { stroke: #5B8CFF; } }
  </style>
  <g class="ink" fill="none" stroke-linecap="round">
    <path d="M17 86L27 38" stroke-width="12"/>
    <path d="M83 86L73 38" stroke-width="12"/>
    <path d="M19.5 74H80.5" stroke-width="11"/>
    <path d="M23.67 54H76.33" stroke-width="11"/>
  </g>
  <path class="ruri" d="M30 16H70" fill="none" stroke-width="11" stroke-linecap="round"/>
</svg>

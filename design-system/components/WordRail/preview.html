<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WordRail — preview</title></head>
<body>
<div id="root" style="padding:16px 0"></div>
<script>
  var H = window.Hashigo, h = React.createElement;
  function Demo() {
    var s = React.useState(3);
    return h('div', { style: { width: 340, margin: '0 auto' } },
      h(H.WordRail, { words: ['上手', '今日', '時間', '東京', '日本', '午前', '午後'], current: s[0], onSelect: s[1] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
